# gate2sky with Docker Compose, terminating TLS itself (Let's Encrypt).
#
#   docker compose run --rm gate2sky config    # create /data/gate2sky.yaml
#   docker compose up -d
#   docker compose exec gate2sky gate2sky config   # manage subdomains, keys, users
#
# Point gate.example.com and *.gate.example.com to this host. In the setup,
# choose Let's Encrypt and keep the default ports (80, 443 and 2222).
services:
  gate2sky:
    image: ghcr.io/gate2sky/gate2sky:latest
    build: ../..
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "2222:2222"
      # With tcp.ports: 30000-30019 in the configuration, publish its range,
      # over UDP too for UDP ports:
      # - "30000-30019:30000-30019"
      # - "30000-30019:30000-30019/udp"
    volumes:
      - gate2sky:/data
    # Secrets referenced as ${VAR} in the configuration:
    # environment:
    #   SMTP_PASSWORD: change-me
    healthcheck:
      test: ["CMD", "gate2sky", "status"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  gate2sky:

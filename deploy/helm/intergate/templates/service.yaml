apiVersion: v1
kind: Service
metadata:
  name: {{ include "intergate.fullname" . }}
  labels:
    {{- include "intergate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "intergate.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: ssh
      port: 2222
      targetPort: ssh
{{- if .Values.sshService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "intergate.fullname" . }}-ssh
  labels:
    {{- include "intergate.labels" . | nindent 4 }}
  {{- with .Values.sshService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.sshService.type }}
  {{- with .Values.sshService.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- if eq .Values.sshService.type "LoadBalancer" }}
  externalTrafficPolicy: Local
  {{- end }}
  selector:
    {{- include "intergate.selectorLabels" . | nindent 4 }}
  ports:
    - name: ssh
      port: {{ .Values.sshService.port }}
      targetPort: ssh
{{- end }}
{{- if .Values.tcp.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "intergate.fullname" . }}-tcp
  labels:
    {{- include "intergate.labels" . | nindent 4 }}
  {{- with .Values.tcp.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.tcp.service.type }}
  {{- with .Values.tcp.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- if ne .Values.tcp.service.type "ClusterIP" }}
  # Allow lists need the visitor's address.
  externalTrafficPolicy: Local
  {{- end }}
  selector:
    {{- include "intergate.selectorLabels" . | nindent 4 }}
  ports:
    {{- range $p := untilStep (int .Values.tcp.first) (int (add1 .Values.tcp.last)) 1 }}
    - name: tcp-{{ $p }}
      port: {{ $p }}
      targetPort: {{ $p }}
      protocol: TCP
    {{- if $.Values.tcp.udp }}
    - name: udp-{{ $p }}
      port: {{ $p }}
      targetPort: {{ $p }}
      protocol: UDP
    {{- end }}
    {{- end }}
{{- end }}

{{- if and .Values.certManager.enabled (not .Values.traefik.tls.secretName) }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "gate2sky.fullname" . }}
  labels:
    {{- include "gate2sky.labels" . | nindent 4 }}
spec:
  secretName: {{ include "gate2sky.tlsSecret" . }}
  dnsNames:
    - {{ .Values.domain | quote }}
    - {{ printf "*.%s" .Values.domain | quote }}
  issuerRef:
    {{- toYaml .Values.certManager.issuerRef | nindent 4 }}
{{- end }}

{{- $sshPublicHost := .Values.ssh.publicHost | default .Values.domain -}}
{{- $defaults := dict
  "public_url" (printf "https://%s" .Values.domain)
  "data_dir" "/data"
  "http" (dict "listen" ":8080" "trust_proxy_headers" true)
  "ssh" (dict "listen" ":2222" "public_host" $sshPublicHost "public_port" (int .Values.ssh.publicPort) "proxy_protocol" (eq (include "gate2sky.proxyProtocol" .) "true"))
-}}
{{- $config := mergeOverwrite $defaults (deepCopy .Values.config) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gate2sky.fullname" . }}
  labels:
    {{- include "gate2sky.labels" . | nindent 4 }}
data:
  gate2sky.yaml: |
    {{- toYaml $config | nindent 4 }}

<script :setup>
  // The signed-in user's subdomains, and the form that registers one.
  const { app } = await import("@ui/lib/store.js")
  const { api } = await import("@ui/lib/api.js")
  const { ago } = await import("@ui/lib/format.js")
  const RegisterForm = await import("@ui/components/register-form.html")
  const StatusBadge = await import("@ui/components/status-badge.html")
  const AccessBadge = await import("@ui/components/access-badge.html")
  const Alert = await import("@theme/components/alert.html")
  const Badge = await import("@theme/components/badge.html")
  const Button = await import("@theme/components/button.html")
  const Card = await import("@theme/components/card.html")
  const Icon = await import("@theme/components/icon.html")
  const Modal = await import("@theme/components/modal.html")

  document.title = "Subdomains · intergate"

  let subdomains = []
  let loadError = ""
  const load = async () => {
    try {
      subdomains = await api("GET", "/subdomains")
      loadError = ""
    } catch (e) {
      loadError = e.message
    }
  }
  await load()

  // Tunnels come and go: keep the list current while it is on screen.
  $attached(() => {
    const timer = setInterval(() => document.hidden || load(), 5000)
    const off = $detached(() => {
      clearInterval(timer)
      off()
    })
  })

  // With subdomains listed, the register form opens in a dialog, new each
  // time: it stays while the dialog plays its way out, and goes once it
  // has.
  let registering = false
  let registerForm = false
  const openRegister = () => {
    registerForm = true
    registering = true
  }
</script>

<div class="page-head">
  <div class="page-title"><h1>Subdomains</h1><Badge size="lg">{{ subdomains.length }} of {{ app.limits.subdomains }}</Badge></div>
  <Button :if="subdomains.length" icon="plus" @click="openRegister">Register a subdomain</Button>
</div>

<Alert :if="loadError" tone="bad">{{ loadError }}</Alert>

<Card :if="subdomains.length">
  <div class="table-wrap">
    <table class="table tiles">
      <thead><tr><th>Subdomain</th><th>Status</th><th>Access</th><th class="hide-narrow">SSH keys</th><th></th></tr></thead>
      <tbody>
        <tr :each="sub in subdomains" :key="sub.name">
          <td>
            <a class="name-cell" :href="'/subdomains/' + encodeURIComponent(sub.name)">
              <span class="tile" :class="'tile-' + sub.access" aria-hidden="true">{{ sub.name[0] }}</span>
              <span><strong>{{ sub.name }}</strong><span class="url muted small">{{ sub.url }}</span></span>
            </a>
          </td>
          <td><StatusBadge :tunnel="sub.tunnel" /><span :if="sub.tunnel" class="muted small hide-narrow">{{ ago(sub.tunnel.created_at) }}</span></td>
          <td><AccessBadge :access="sub.access" /></td>
          <td class="hide-narrow">{{ sub.keys }}</td>
          <td class="right row-actions">
            <Button variant="ghost" square icon="external" title="Open" :label="'Open ' + sub.url" :href="sub.url" target="_blank" />
            <Button variant="ghost" square icon="sliders" title="Manage" :label="'Manage ' + sub.name" :href="'/subdomains/' + encodeURIComponent(sub.name)" />
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</Card>
<Card :elseif="!loadError">
  <div class="empty">
    <span class="empty-icon"><Icon name="globe" size="2xl" weight="thin" /></span>
    <p>No subdomains yet. Register one with your SSH public key, then connect with <code>ssh -R</code>.</p>
  </div>
</Card>

<Card :if="!subdomains.length" title="Register a subdomain">
  <RegisterForm />
</Card>

<Modal :open="registering" size="lg" title="Register a subdomain" @close="registering = false" @closed="registerForm = false">
  <RegisterForm :if="registerForm" :cancel="true" @cancel="registering = false" />
</Modal>

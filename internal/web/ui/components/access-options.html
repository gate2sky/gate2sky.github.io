<script :setup="{ model = 'public', name = 'access', disabled = false }">
  // Who can open a subdomain, as three option cards. The choice goes back up
  // through `:model`, and as a `pick` event for a parent that saves it.
  //
  //   <AccessOptions :model="access" />
  //   <AccessOptions :model="sub.access" @pick="save($event.detail)" />
  const ChoiceCards = await import("@theme/components/choice-cards.html")
  const OPTIONS = [
    { value: "public", label: "Public", hint: "Anyone with the URL", hue: "blue", icon: "globe" },
    { value: "users", label: "Signed-in users", hint: "Anyone who can sign in to this intergate", hue: "orange", icon: "users" },
    { value: "private", label: "Private", hint: "Only the owner, after signing in", hue: "pink", icon: "lock" },
  ]
  const pick = value => {
    $updateModel(value)
    $emit("pick", value)
  }
</script>

<ChoiceCards :name="name" :model="model" :items="OPTIONS" :disabled="disabled" @change="pick($event.detail)" />

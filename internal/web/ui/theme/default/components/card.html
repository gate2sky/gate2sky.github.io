<script :setup="{ title = '', tone = 'neutral', width = '', center = false }">
  // A light material over the wallpaper that groups one thing: a list, a
  // form, a subdomain's connection. A head when there is a `title` or
  // something in the `aside` slot (a count, a button), and the content.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-10-29.a-design-system.completed.md`.
  //
  //   <Card title="SSH keys">
  //     <template :slot.aside><Badge>{{ keys.length }} of 20</Badge></template>
  //     …
  //   </Card>
  //
  // `tone` is `neutral`, `accent` (a callout: a step to take) or `bad` (a
  // danger zone). `width` makes it a card for one thing alone, centred on
  // the page — `sm` (400px) to sign in, `md` (440px) for the setup, `lg`
  // (560px) for an error — and
  // `center` centres its text. A card is a `light` island: what is in it
  // draws dark on the material, whatever it sits on.

  const flag = v => v === "" || v === true || v === "true"
  $: isCenter = flag(center)
</script>

<section class="card"
         data-tone="light"
         :class="'tone-' + tone"
         :class.narrow="!!width"
         :class.width-md="width === 'md'"
         :class.width-lg="width === 'lg'"
         :class.center="isCenter">
  <header :if="title || $slots.aside" class="head">
    <h2 :if="title" class="title">{{ title }}</h2>
    <div :if="$slots.aside" class="aside"><slot.aside /></div>
  </header>
  <div class="body" data-flow><slot></slot></div>
</section>

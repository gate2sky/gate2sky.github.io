<script :setup="{ tone = 'neutral', dot = false, pulse = false, solid = false, size = 'md', title = '' }">
  // A short label that says what state something is in, or how many there
  // are: `online`, `public`, `3 of 10`. `tone` is the state — `neutral`,
  // `accent`, `ok`, `warn`, `bad` — as the tone's ink on a tint of its
  // colour; `solid` fills it instead (what is online, in a count). `dot` puts
  // a dot before the text, and `pulse` makes it beat, for something live.
  // `size="lg"` is the count beside a page's title.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-10-29.a-design-system.completed.md`.
  //
  //   <Badge tone="ok" dot pulse>online</Badge>
  //   <Badge>{{ keys.length }} of 20</Badge>

  // A bare attribute (`<X disabled>`) arrives as "", and means on.
  const flag = v => v === "" || v === true || v === "true"
  $: hasDot = flag(dot)
  $: beats = flag(pulse)
  $: isSolid = flag(solid)
</script>

<span class="badge"
      :class="'tone-' + tone"
      :class.solid="isSolid"
      :class.lg="size === 'lg'"
      :title="title || null">
  <i :if="hasDot" class="dot" :class.pulse="beats" aria-hidden="true"></i>
  <slot></slot>
</span>

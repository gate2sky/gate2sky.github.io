<script :setup="{
  variant = 'primary',
  size = 'md',
  type = 'button',
  href = '',
  target = '',
  form = '',
  disabled = false,
  block = false,
  square = false,
  title = '',
  label = '',
  icon = ''
}">
  // A button: tinted glass. `variant` is what it does to the page —
  // `primary` the one thing a view asks for, `secondary` the rest, `danger`
  // one that loses something, `dark` a quiet one that is still a step
  // (signing out), `plain` an action that should not compete with content,
  // and `ghost` an icon in a row of them, red under the pointer when it is
  // `ghost-danger`.
  //
  // **Part of the default theme**: imports only the theme's `Icon`, and
  // draws only with `tokens.css`. See
  // `RECORD/2026-10-29.a-design-system.completed.md`.
  //
  //   <Button @click="save()">Save</Button>
  //   <Button variant="secondary" icon="plus" size="sm">Add port</Button>
  //   <Button variant="ghost-danger" square icon="trash" title="Remove" @click="remove(key)" />
  //   <Button type="submit" form="add-port" :disabled="busy">Add port</Button>
  //   <Button href="/auth/github/login" variant="secondary" block>GitHub</Button>
  //
  // **`click` is re-emitted**, with the native event in `$event.detail`:
  // jq79 binds `@click` on a component to its `$emit` and nothing else. It is
  // not emitted while disabled. A `submit` button submits its form, or the
  // one `form` names (a dialog's foot is outside its form). With `href` it is
  // a link that looks like a button. `square` is for an icon alone, and then
  // `title` is its name; `label` names it for a screen reader alone.

  const Icon = await import("@theme/components/icon.html")

  // A bare attribute (`<X disabled>`) arrives as "", and means on.
  const flag = v => v === "" || v === true || v === "true"
  $: isDisabled = flag(disabled)
  $: isBlock = flag(block)
  $: isSquare = flag(square)

  const click = event => {
    if (isDisabled) return
    $emit("click", event)
  }
</script>

<a :if="href"
   class="btn"
   :class="'variant-' + variant + ' size-' + size"
   :class.block="isBlock"
   :class.square="isSquare"
   :href="href"
   :target="target || null"
   :rel="target ? 'noopener noreferrer' : null"
   :aria-label="label || null"
   :title="title || null"
   @click="click($event)">
  <Icon :if="icon" :name="icon" :size="size === 'sm' ? 'sm' : 'md'" />
  <slot></slot>
</a>
<button :else
        class="btn"
        :class="'variant-' + variant + ' size-' + size"
        :class.block="isBlock"
        :class.square="isSquare"
        :type="type"
        :form="form || null"
        :disabled="isDisabled"
        :aria-label="label || (isSquare ? title : '') || null"
        :title="title || null"
        @click="click($event)">
  <Icon :if="icon" :name="icon" :size="size === 'sm' ? 'sm' : 'md'" />
  <slot></slot>
</button>

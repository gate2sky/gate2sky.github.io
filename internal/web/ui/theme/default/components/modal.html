<script :setup="{ open = false, title = '', size = 'sm', dismissible = true }">
  // A question or a form over the page, answered or left before the page is
  // used again. The platform's `<dialog>`, opened with `showModal()`: the
  // focus held inside, the page behind made inert, and a backdrop that dims
  // and blurs it. A light material near the top of the window.
  //
  // **Part of the default theme**: imports only the theme's `Icon`, and
  // draws only with `tokens.css`. See
  // `RECORD/2026-10-29.a-design-system.completed.md`.
  //
  //   <Modal :open="deleting" title="Delete this user?" @close="deleting = false">
  //     <p>Their subdomains go with them.</p>
  //     <template :slot.foot>
  //       <Button variant="secondary" @click="deleting = false">Cancel</Button>
  //       <Button variant="danger" @click="remove()">Delete</Button>
  //     </template>
  //   </Modal>
  //
  // **The owner decides whether it closes.** Escape, a click on the backdrop
  // and the close button only emit `close`; it closes when `:open` goes
  // false, and plays its way out first, then emits `closed`. `dismissible`
  // false refuses all three and hides the close button — for a question with
  // no way back. `size` is its width: `sm` (360px) for a question, `md`
  // (480px), `lg` (620px) for a form, `xl` (1180px) for a workspace — the
  // demo's inspector; never wider than the window, and its body scrolls
  // when it is taller.
  //
  // A form in the body submits from a button in the foot with that button's
  // `form` set to the form's id: the foot is outside the form.

  const Icon = await import("@theme/components/icon.html")

  // A bare attribute (`<X disabled>`) arrives as "", and means on.
  const flag = v => v === "" || v === true || v === "true"
  $: isOpen = flag(open)
  $: isDismissible = flag(dismissible)

  let leaving = false

  // How long the way out is, from the token, so reduced motion is no wait.
  const exit = () => {
    const ms = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--ig-duration-slow"))
    return Number.isFinite(ms) ? ms : 0
  }

  const show = () => {
    const dialog = $self("dialog")
    if (!dialog || dialog.open) return
    leaving = false
    dialog.showModal()
  }
  const hide = () => {
    const dialog = $self("dialog")
    if (!dialog?.open || leaving) return
    const done = () => {
      dialog.close()
      leaving = false
      $emit("closed")
    }
    const ms = exit()
    if (!ms) return done()
    leaving = true
    setTimeout(done, ms)
  }

  const ask = () => {
    if (isDismissible) $emit("close")
  }
  // Escape is the platform's, and it would close the dialog behind the
  // owner's back; it becomes a request like the others.
  const cancel = event => {
    event.preventDefault()
    ask()
  }
  // A click whose target is the dialog itself landed on the backdrop: the
  // box fills the dialog, so anything inside has a target of its own. Only
  // when the press started there too, so a drag that selects text in a
  // field and lets go outside it does not close the form.
  let pressedOutside = false
  const press = event => {
    pressedOutside = event.target === event.currentTarget
  }
  const backdrop = event => {
    if (pressedOutside && event.target === event.currentTarget) ask()
    pressedOutside = false
  }

  await $mounted()
  $: isOpen ? requestAnimationFrame(show) : hide()
</script>

<dialog class="modal"
        data-tone="light"
        :class="'size-' + size"
        :class.leaving="leaving"
        :aria-label="title || null"
        @cancel="cancel($event)"
        @pointerdown="press($event)"
        @click="backdrop($event)">
  <div class="box">
    <header :if="title || isDismissible" class="head">
      <h2 class="title">{{ title }}</h2>
      <button :if="isDismissible" type="button" class="close" title="Close" aria-label="Close" @click="ask()">
        <Icon name="close" />
      </button>
    </header>
    <div class="body" data-flow><slot></slot></div>
    <footer :if="$slots.foot" class="foot"><slot.foot /></footer>
  </div>
</dialog>

<script :setup="{ items = [], model = '', label = '' }">
  // One of a few, side by side, the chosen one raised: which system a
  // command is for, where a server runs.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-10-29.a-design-system.completed.md`.
  //
  //   <Segmented label="Operating system" :model="os"
  //              :items="[{ value: 'unix', label: 'Linux / macOS' }, { value: 'windows', label: 'Windows' }]" />
  //
  // An item is a string or `{ value, label }`. The choice goes up through
  // `:model` and as `change`.

  $: options = items.map(o => typeof o === "string" ? { value: o, label: o } : o)

  const choose = option => {
    if (option.value === model) return
    $updateModel(option.value)
    $emit("change", option.value)
  }
</script>

<div class="segmented" role="group" :aria-label="label || null">
  <button :each="option in options" :key="String(option.value)" type="button"
          :aria-pressed="option.value === model ? 'true' : 'false'"
          @click="choose(option)">{{ option.label }}</button>
</div>

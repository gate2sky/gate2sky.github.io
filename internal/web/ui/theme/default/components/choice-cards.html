<script :setup="{ items = [], model = '', name = 'choice', disabled = false, layout = 'row' }">
  // One of a few, each a card with an icon, a name, a line about it and a
  // check: who can open a subdomain, who can connect to a port. Radios under
  // the cards, so the arrows move between them as in any radio group.
  //
  // **Part of the default theme**: imports only the theme's `Icon`, and
  // draws only with `tokens.css`. See
  // `RECORD/2026-10-29.a-design-system.completed.md`.
  //
  //   <ChoiceCards name="access" :model="access" :items="[
  //     { value: 'public', label: 'Public', hint: 'Anyone with the URL', hue: 'blue', icon: 'globe' },
  //     { value: 'private', label: 'Private', hint: 'Only the owner', hue: 'pink', icon: 'lock' },
  //   ]" />
  //
  // `hue` colours the card when chosen and its icon (`blue`, `purple`,
  // `green`, `orange`, `teal`, `pink`); `icon` is optional. `layout` is
  // `row` — side by side on a wide screen, as many columns as cards — or
  // `stack`, one under another. The choice goes up through `:model` and as
  // `change`.

  const Icon = await import("@theme/components/icon.html")

  const flag = v => v === "" || v === true || v === "true"
  $: isDisabled = flag(disabled)
  $: columns = Math.min(items.length, 4)

  const pick = value => {
    $updateModel(value)
    $emit("change", value)
  }
</script>

<div class="choices" :class="'layout-' + layout + ' columns-' + columns">
  <label :each="item in items" :key="String(item.value)" class="choice" :class="'hue-' + (item.hue || 'blue')">
    <input type="radio" :name="name" :value="item.value" :checked="model === item.value" :disabled="isDisabled"
           @change="pick(item.value)">
    <span :if="item.icon" class="icon"><Icon :name="item.icon" size="lg" weight="light" /></span>
    <span class="text"><strong>{{ item.label }}</strong> <span :if="item.hint" class="hint">{{ item.hint }}</span></span>
    <span class="check"><Icon name="check" size="sm" weight="bold" /></span>
  </label>
</div>

<script :setup="{ items = [], columns = 'auto' }">
  // Facts about one thing, each in a tile tinted by its icon's hue: a
  // tunnel's client and traffic, a relay's server. Read, not changed.
  //
  // **Part of the default theme**: imports only the theme's `Icon`, and
  // draws only with `tokens.css`. See
  // `RECORD/2026-10-29.a-design-system.completed.md`.
  //
  //   <Facts columns="3" :items="[
  //     { label: 'Client', value: tunnel.client_addr, icon: 'monitor', hue: 'blue' },
  //     { label: 'Requests', value: tunnel.requests, icon: 'forward', hue: 'orange' },
  //   ]" />
  //
  // An item is `{ label, value, icon, hue }`; one whose `value` is null or
  // empty is left out. Two columns on a phone; on a wide screen `columns` is
  // `3`, or `auto` for as many as fit.

  const Icon = await import("@theme/components/icon.html")

  $: shown = items.filter(item => item.value !== null && item.value !== undefined && item.value !== "")
</script>

<dl class="facts" :class="'columns-' + columns">
  <div :each="item in shown" :key="item.label" class="fact" :class="'hue-' + (item.hue || 'gray')">
    <dt><span class="icon"><Icon :name="item.icon" weight="bold" /></span>{{ item.label }}</dt>
    <dd>{{ item.value }}</dd>
  </div>
</dl>

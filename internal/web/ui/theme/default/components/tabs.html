<script :setup="{ items = [], model = '', label = '' }">
  // Views of one thing, one at a time: a page's lists, a subdomain's
  // settings. Pills, the chosen one filled. Only the strip is drawn here; the
  // owner shows the panel that `model` names.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-10-29.a-design-system.completed.md`.
  //
  //   <Tabs label="Admin" :model="tab" :items="[
  //     { value: 'users', label: 'Users', count: users.length },
  //     { value: 'subdomains', label: 'Subdomains', count: 4, extra: '2 online' },
  //     { value: 'danger', label: 'Danger zone', tone: 'bad' },
  //   ]" />
  //   <section :if="tab === 'users'" role="tabpanel">…</section>
  //
  // An item is a string or `{ value, label, count, extra, tone }`: `count`
  // is a small number beside the label, `extra` a note in green after it
  // (what is online), and `tone: 'bad'` a tab whose name turns red when it
  // is chosen. The arrows, Home and End move between tabs and choose as they
  // go. The choice goes up through `:model` and as `change`.

  $: tabs = items.map(t => typeof t === "string" ? { value: t, label: t } : t)

  const choose = tab => {
    if (tab.value === model) return
    $updateModel(tab.value)
    $emit("change", tab.value)
  }

  const STEP = { ArrowRight: 1, ArrowLeft: -1 }
  const key = (e, tab) => {
    const i = tabs.indexOf(tab)
    const next =
      e.key === "Home" ? tabs[0] :
      e.key === "End" ? tabs[tabs.length - 1] :
      e.key in STEP ? tabs[(i + STEP[e.key] + tabs.length) % tabs.length] :
      null
    if (!next) return
    e.preventDefault()
    choose(next)
    $self(".tabs").querySelectorAll("button")[tabs.indexOf(next)]?.focus()
  }
</script>

<div class="tabs" role="tablist" :aria-label="label || null">
  <button :each="tab in tabs"
          :key="String(tab.value)"
          type="button"
          role="tab"
          :aria-selected="tab.value === model ? 'true' : 'false'"
          :tabindex="tab.value === model ? 0 : -1"
          :class.bad="tab.tone === 'bad'"
          @click="choose(tab)"
          @keydown="key($event, tab)">
    {{ tab.label }}
    <span :if="tab.count !== undefined && tab.count !== null" class="count">{{ tab.count }}</span>
    <span :if="tab.extra" class="count extra">{{ tab.extra }}</span>
  </button>
</div>

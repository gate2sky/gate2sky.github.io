<script :setup="{ tone = 'info', flush = false }">
  // A message about the view around it: a notice, a caveat, a refusal.
  // `tone` is how much it matters — `info` to say something, `ok` that
  // something went well, `warn` that something might not, `bad` that
  // something did not.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-10-29.a-design-system.completed.md`.
  //
  //   <Alert :if="error" tone="bad">{{ error }}</Alert>
  //   <Alert tone="warn">Redis accepts anyone without a password.</Alert>
  //
  // `bad` is announced as an alert, the rest as a status. It keeps a block's
  // space below it, as a paragraph does; `flush` drops it, for an alert in a
  // grid that spaces its rows itself.

  const flag = v => v === "" || v === true || v === "true"
  $: isFlush = flag(flush)
</script>

<div class="alert"
     :class="'tone-' + tone"
     :class.flush="isFlush"
     :role="tone === 'bad' ? 'alert' : 'status'"><slot></slot></div>

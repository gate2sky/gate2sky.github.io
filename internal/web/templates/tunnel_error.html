<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}}</title>
<style>
  :root { color-scheme: light dark; --fg:#1b1f24; --muted:#5b6470; --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e6e8eb; --muted:#9aa3ad; --bg:#0f1216; --card:#171b21; --line:#262c34; --accent:#6c9cff; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--fg);
    font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:520px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:32px; }
  .code { font:600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--muted); letter-spacing:.06em; }
  h1 { margin:8px 0 8px; font-size:22px; }
  p { margin:0 0 16px; color:var(--muted); }
  a { color:var(--accent); }
  footer { font-size:13px; color:var(--muted); margin-top:24px; }
</style>
</head>
<body>
<main>
  <div class="code">{{.Status}}</div>
  <h1>{{.Title}}</h1>
  <p>{{.Msg}}</p>
  <footer>Served by gate2sky · <a href="{{.DashboardURL}}">dashboard</a></footer>
</main>
</body>
</html>

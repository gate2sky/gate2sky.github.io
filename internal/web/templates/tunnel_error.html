<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}}</title>
<style>
  :root { color-scheme: light; --fg:#1d2125; --muted:#333a3e; --bg:#121212; --line:rgb(0 0 0 / .1); --link:#074791; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--fg);
    font:15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, Roboto, sans-serif; -webkit-font-smoothing:antialiased;
    background: radial-gradient(60vmax 50vmax at 8% -6%, rgb(10 132 255 / .5), transparent 70%),
      radial-gradient(52vmax 46vmax at 100% 4%, rgb(191 90 242 / .42), transparent 70%),
      radial-gradient(64vmax 50vmax at 70% 108%, rgb(64 200 224 / .38), transparent 70%), var(--bg) fixed; }
  main { max-width:520px; width:100%; background:rgb(255 255 255 / .75); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    border:.5px solid var(--line); border-radius:14px; padding:32px; box-shadow:0 .5px 0 rgb(255 255 255 / .8) inset, 0 14px 36px rgb(10 14 30 / .3); }
  .code { display:inline-block; font:600 12px/1 ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; color:var(--muted); letter-spacing:.06em;
    background:rgb(0 0 0 / .06); padding:5px 9px; border-radius:999px; }
  h1 { margin:12px 0 8px; font-size:22px; letter-spacing:-.02em; }
  p { margin:0 0 16px; color:var(--muted); }
  a { color:var(--link); text-decoration:none; }
  a:hover { text-decoration:underline; }
  footer { font-size:12px; color:var(--muted); margin-top:24px; }
</style>
</head>
<body>
<main>
  <div class="code">{{.Status}}</div>
  <h1>{{.Title}}</h1>
  <p>{{.Msg}}</p>
  <footer>Served by intergate · <a href="{{.DashboardURL}}">dashboard</a></footer>
</main>
</body>
</html>

{{define "content"}}
<section class="card login">
  <h1>Check your email</h1>
  <p class="muted">If <strong>{{.Page.Email}}</strong> can sign in here, we just sent it a 6-digit code.</p>
  {{with .Page.Error}}<div class="flash flash-error" role="alert">{{.}}</div>{{end}}
  <form method="post" action="/login/code" class="form form-login">
    <label>Code
      <input class="code-input" name="code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" placeholder="123456" autofocus>
    </label>
    <button type="submit" class="button button-block">Sign in</button>
  </form>
  <p class="small muted">Didn’t get it? Check your spam folder or <a href="/login">try again</a>.</p>
</section>
{{end}}

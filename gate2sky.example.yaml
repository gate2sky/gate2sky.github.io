# gate2sky configuration.
#
# `gate2sky config` writes this file for you with an interactive wizard.
# ${VAR} in values is replaced with environment variables, and relative
# paths are relative to this file's directory.

# Dashboard URL. Tunnels are served on its subdomains:
# https://<name>.gate.example.com. Point both gate.example.com and
# *.gate.example.com at this server in DNS.
public_url: https://gate.example.com

# SQLite database, SSH host key, signing key and certificates live here.
data_dir: /var/lib/gate2sky

http:
  listen: ":80"
  # Remove the tls block when a reverse proxy (Traefik, Caddy, nginx...)
  # terminates TLS in front of gate2sky, and keep public_url on https.
  tls:
    listen: ":443"
    # Either a wildcard certificate for gate.example.com and *.gate.example.com:
    # cert_file: /etc/gate2sky/fullchain.pem
    # key_file: /etc/gate2sky/privkey.pem
    # ...or certificates from Let's Encrypt, issued on demand for the
    # dashboard and every registered subdomain:
    acme:
      enabled: true
      email: admin@example.com
  # Trust X-Forwarded-For from a reverse proxy you control.
  trust_proxy_headers: false

ssh:
  listen: ":2222"
  # What users type in `ssh -p <public_port> <public_host>`, if different
  # from the dashboard host and the listen port (e.g. behind a NAT or proxy).
  # public_host: gate.example.com
  # public_port: 22
  # Expect a PROXY protocol header (v1 or v2) on every connection, e.g. from
  # Traefik or HAProxy, to see real client addresses.
  proxy_protocol: false

auth:
  session_ttl: 168h
  # Who may sign in. Admins can always sign in and see the admin page, and
  # users an administrator adds from the dashboard may sign in as well.
  admins: [you@example.com]
  allowed_emails: []
  allowed_domains: [example.com]
  # allow_everyone: true   # any verified email, e.g. for a public service

  # Sign in with a one-time code sent by email. Users can then add passkeys.
  email:
    from: "gate2sky <no-reply@gate.example.com>"
    code_ttl: 10m
    smtp:
      host: smtp.example.com
      port: 587
      tls: starttls   # starttls, tls (port 465) or none (local relay only)
      username: gate2sky
      password: ${SMTP_PASSWORD}
    # For local development only: write the codes to the log instead.
    # log_only: true

  # Passkeys (WebAuthn) are on by default.
  # disable_passkeys: true

  # Optional OAuth providers. Accounts are matched by verified email.
  # providers:
  #   # GitHub OAuth app: https://github.com/settings/developers
  #   # Callback URL: https://gate.example.com/auth/github/callback
  #   - id: github
  #     type: github
  #     client_id: ${GITHUB_CLIENT_ID}
  #     client_secret: ${GITHUB_CLIENT_SECRET}
  #   # Any OpenID Connect provider: Google, GitLab, Microsoft Entra ID,
  #   # Keycloak, Authentik... Callback URL: https://gate.example.com/auth/<id>/callback
  #   - id: google
  #     type: oidc
  #     name: Google
  #     issuer: https://accounts.google.com
  #     client_id: ${GOOGLE_CLIENT_ID}
  #     client_secret: ${GOOGLE_CLIENT_SECRET}

# admin:
#   # Unix socket used by `gate2sky config` and `gate2sky status`.
#   socket: /var/lib/gate2sky/admin.sock

limits:
  subdomains_per_user: 10
  keys_per_subdomain: 20
  tunnels_per_connection: 5

# Raw TCP ports for subdomains (databases, SSH, games...), forwarded with
# ssh -R <port>.<subdomain>:0:localhost:<local port>. Each port gets a public
# number from this range for good; open the range in your firewall.
# tcp:
#   ports: 30000-30019
#   max_ports: 5                    # per subdomain
#   public_host: gate.example.com   # defaults to the SSH host

# Names nobody can register, on top of the built-in list (www, admin, api...).
reserved_subdomains: []

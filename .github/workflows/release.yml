name: Release

# Started by hand from the Actions tab, on the default branch: raises the
# version, builds that commit with build.yml, publishes the GitHub release
# with the binaries pages/setup.sh installs, the Docker image and the Helm
# chart, and deploys the landing, the design system's demo and the Helm
# repository to GitHub Pages.
# Every binary, the image and the chart carry a build provenance attestation:
# `gh attestation verify <file> --repo jgermade/intergate`.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise.
        type: choice
        options: [patch, minor, major]
        default: patch
      dry-run:
        description: Build everything and publish nothing — just check the release would work.
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Raise the version
        id: bump
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry-run }}" != "true" ] && [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::release from ${{ github.event.repository.default_branch }}, not $GITHUB_REF_NAME (or tick dry-run)"
            exit 1
          fi

          current=$(cat VERSION)
          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"
          echo "$current → $next"
          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "::error::v$next already exists"
            exit 1
          fi

          # The version lives in VERSION; the Helm chart follows it, so its
          # default image is the one this release publishes.
          echo "$next" > VERSION
          sed -i -E "s/^version: .*/version: $next/; s/^appVersion: .*/appVersion: \"$next\"/" deploy/helm/intergate/Chart.yaml
          # The landing's footer shows the version too.
          python3 scripts/landing/gen.py scripts/landing/template.html pages/index.html
          git diff

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "dry run: leaving the bump uncommitted"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION deploy/helm/intergate/Chart.yaml pages/index.html
          git commit -m "Release v$next"
          git tag -a "v$next" -m "v$next"
          git push origin HEAD --follow-tags
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      # The bump is a new commit: build it, not the commit the release started from.
      ref: ${{ needs.version.outputs.sha }}
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: intergate-*
          path: dist
          merge-multiple: true
      # Signed by GitHub with this workflow's identity: proves each archive
      # was built here, from this commit.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # What pages/setup.sh checks a download against before it installs it.
          # tunnel.sh and tunnel.ps1 check theirs the same way.
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS)
          gh release create "${{ needs.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS

  image:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          # The image is named after the project: ghcr.io/<owner>/intergate.
          tags: |
            ghcr.io/${{ github.repository_owner }}/intergate:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/intergate:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/intergate
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The chart, two ways, so there is nothing to clone: as an OCI artifact
  # (`helm install intergate oci://ghcr.io/<owner>/charts/intergate`; under
  # charts/ so it does not land on the image's ghcr.io/<owner>/intergate) and
  # attached to the release, where the classic repository the pages job
  # publishes points (`helm repo add intergate https://jgermade.github.io/intergate/charts`).
  chart:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: azure/setup-helm@v4
      - name: Push the chart
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chart="dist/intergate-${{ needs.version.outputs.version }}.tgz"
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/intergate -d dist
          helm push "$chart" oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest: //p' push.log)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          gh release upload "${{ needs.version.outputs.tag }}" "$chart" --repo "$GITHUB_REPOSITORY"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/intergate-${{ needs.version.outputs.version }}.tgz
      # The attestation is pushed with Docker's credentials, not the ones
      # `helm registry login` keeps in Helm's own config.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/intergate
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/intergate-${{ needs.version.outputs.version }}.tgz

  # The landing tells people to install the chart, so it waits for it. Pages
  # replaces the whole site on each deploy, so the Helm repository's index
  # starts from the one being served: every release adds its chart, which
  # stays a download of its own release. The design system's demo is the
  # release's own, at theme/.
  pages:
    needs: [version, build, chart]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: chart
          path: chart
      - uses: azure/setup-helm@v4
      - name: The site, with the design system and the Helm repository
        run: |
          set -euo pipefail
          cp -r pages site
          scripts/theme-site.sh site/theme
          mkdir -p site/charts
          # Only a site with no repository yet may start a new index: any
          # other failure would drop the earlier releases from it.
          code=$(curl -sS -o served.yaml -w '%{http_code}' https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/charts/index.yaml)
          case "$code" in
            200) merge=(--merge served.yaml) ;;
            404) merge=() ;;
            *) echo "::error::https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/charts/index.yaml answered $code"; exit 1 ;;
          esac
          helm repo index chart "${merge[@]}" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/${{ needs.version.outputs.tag }}"
          mv chart/index.yaml site/charts/index.yaml
          cat site/charts/index.yaml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

name: Build

# Every push: dependencies, tests, the binaries the installer downloads, the
# Docker image, the Helm chart and the landing. The release runs this same
# workflow on the commit that raises the version, and publishes what it built.
on:
  push:
    branches: ["**"]
  workflow_call:
    inputs:
      ref:
        description: Commit to build. Defaults to the caller's ref.
        type: string
        default: ""
      version:
        description: Version stamped into the binaries. Defaults to VERSION plus -dev and the commit.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Dependencies
        run: go mod download && go mod verify
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Compiles for every platform
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/intergate
          done
          for target in windows/amd64 windows/arm64 linux/amd64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/intergate-gui
          done
      - name: Version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="$(cat VERSION)-dev+$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building intergate $version"

  # The four targets pages/setup.sh installs, and Windows for the client
  # (tunnel.ps1). Pure Go (the SQLite driver too), so every one is a static
  # binary cross-compiled here.
  binary:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux-amd64, linux-arm64, darwin-amd64, darwin-arm64, windows-amd64, windows-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build intergate-${{ matrix.target }}
        run: |
          set -euo pipefail
          target=${{ matrix.target }}
          exe=intergate
          case "$target" in windows-*) exe=intergate.exe ;; esac
          mkdir -p "dist/intergate-$target"
          CGO_ENABLED=0 GOOS=${target%-*} GOARCH=${target#*-} go build -trimpath \
            -ldflags "-s -w -X main.version=${{ needs.test.outputs.version }}" \
            -o "dist/intergate-$target/$exe" ./cmd/intergate
          case "$target" in
          windows-*)
            # The desktop app: a window and a tray icon, no console.
            CGO_ENABLED=0 GOOS=windows GOARCH=${target#*-} go build -trimpath \
              -ldflags "-s -w -H windowsgui -X main.version=${{ needs.test.outputs.version }}" \
              -o "dist/intergate-$target/intergate-gui.exe" ./cmd/intergate-gui
            ;;
          esac
          cp README.md "dist/intergate-$target/"
          # The layout pages/setup.sh, tunnel.sh and tunnel.ps1 unpack:
          # intergate-<target>/intergate(.exe), a zip for Windows.
          case "$target" in
          windows-*) (cd dist && zip -qr "intergate-$target.zip" "intergate-$target") ;;
          *) tar -czf "dist/intergate-$target.tar.gz" -C dist "intergate-$target" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: intergate-${{ matrix.target }}
          path: |
            dist/intergate-${{ matrix.target }}.tar.gz
            dist/intergate-${{ matrix.target }}.zip
          if-no-files-found: error

  # The one-line installer walked against builds of this tree: install,
  # update, reinstall, a bad checksum, uninstall and purge, in the sh that
  # `curl … | sh` lands in on each system.
  installer:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh pages/setup.sh && shellcheck scripts/setup-check.sh scripts/theme-site.sh
      - run: scripts/setup-check.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - run: docker build --build-arg VERSION=${{ needs.test.outputs.version }} -t intergate:build .
      - run: docker run --rm intergate:build version

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/intergate
      - name: Render with the default values
        run: helm template g2s deploy/helm/intergate > default.yaml
      - name: Render with a LoadBalancer for SSH, cert-manager and secrets
        run: |
          helm template g2s deploy/helm/intergate \
            --set domain=tunnels.example.org \
            --set traefik.ssh.enabled=false --set sshService.enabled=true \
            --set certManager.enabled=true \
            --set tcp.enabled=true --set tcp.first=31000 --set tcp.last=31002 \
            --set secretEnv.SMTP_PASSWORD=x > alt.yaml
      - name: Render a release installed with the gate2net chart
        run: helm template gate2net deploy/helm/intergate --set nameOverride=gate2net > legacy.yaml
      - name: Check the rendered configuration
        run: |
          grep -q 'proxy_protocol: true' default.yaml
          grep -q 'proxy_protocol: false' alt.yaml
          grep -q 'public_url: https://tunnels.example.org' alt.yaml
          grep -q 'kind: IngressRouteTCP' default.yaml
          ! grep -q 'kind: IngressRouteTCP' alt.yaml
          grep -q 'kind: Certificate' alt.yaml
          grep -q 'ports: 31000-31002' alt.yaml
          grep -q 'port: 31002' alt.yaml
          grep -q 'name: udp-31002' alt.yaml
          ! grep -q 'g2s-intergate-tcp' default.yaml
          grep -q "image: \"ghcr.io/jgermade/intergate:$(cat VERSION)\"" default.yaml
          grep -q 'claimName: gate2net$' legacy.yaml
          grep -q 'app.kubernetes.io/name: gate2net$' legacy.yaml

  # What Pages serves: pages/ as it is, the landing and setup.sh, and the
  # design system's demo under theme/. Every push checks it; only a release
  # deploys it, with the Helm repository's index.
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: The landing is self-contained and built from its template
        run: |
          set -euo pipefail
          if grep -rInE '(src|href)="https?://' pages/ | grep -vE 'https://(github\.com|jgermade\.github\.io)/'; then
            echo "::error::pages/ must not load anything from another host"
            exit 1
          fi
          python3 scripts/landing/gen.py scripts/landing/template.html "$RUNNER_TEMP/index.html"
          cmp "$RUNNER_TEMP/index.html" pages/index.html || {
            echo "::error::pages/index.html is out of date: run python3 scripts/landing/gen.py scripts/landing/template.html pages/index.html"
            exit 1
          }
          test -s pages/setup.sh
          for icon in favicon.svg favicon.ico apple-touch-icon.png og.png; do test -s "pages/$icon"; done
      - name: The design system's demo assembles as a static site
        run: |
          set -euo pipefail
          scripts/theme-site.sh "$RUNNER_TEMP/theme"
          for f in index.html tokens.css demo.html demo/inspector.html components/button.html vendor/jq79.js; do test -s "$RUNNER_TEMP/theme/$f"; done
